<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle do Vale Alimentação</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }
    h1 {
      font-size: 1.5em;
      text-align: center;
    }
    button {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    .total {
      margin-top: 10px;
      font-weight: bold;
    }
    .limit {
      font-size: 0.9em;
      color: gray;
    }
    .aviso {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    .progress-container {
      width: 100%;
      height: 20px;
      background-color: #ddd;
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      text-align: center;
      color: white;
      font-size: 12px;
      line-height: 20px;
      border-radius: 10px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      background: #f2f2f2;
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Controle do Vale Alimentação</h1>

  <label for="valor">Valor da Tarefa (R$):</label>
  <input type="text" id="valor" placeholder="Ex: 24,69 ou 24.69" />

  <button onclick="registrarTarefa()">Registrar </button>

  <div class="total" id="total">Total: R$ 0,00</div>
  <div class="limit">Limite: R$ 642,00</div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">0%</div>
  </div>

  <div class="aviso" id="avisoLimite" style="display: none;"></div>

  <h2>Histórico</h2>
  <ul id="historico"></ul>

  <button onclick="limparHistorico()" style="background-color: #f44336; color: white;">
    Limpar Histórico
  </button>

  <script>
    const LIMITE = 642.0;

    function formatarReal(valor) {
      return "R$ " + valor.toFixed(2).replace(".", ",");
    }

    function carregarHistorico() {
      return JSON.parse(localStorage.getItem("tarefas") || "[]");
    }

    function salvarHistorico(historico) {
      localStorage.setItem("tarefas", JSON.stringify(historico));
    }

    function atualizarTela() {
      const historico = carregarHistorico();
      const lista = document.getElementById("historico");
      const aviso = document.getElementById("avisoLimite");
      const progressBar = document.getElementById("progressBar");
      lista.innerHTML = "";

      let total = 0;
      historico.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = `${item.data} - ${formatarReal(item.valor)}`;
        lista.appendChild(li);
        total += item.valor;
      });

      document.getElementById("total").textContent = `Total: ${formatarReal(total)}`;

      // Aviso se passou do limite
      if (total > LIMITE) {
        const excesso = total - LIMITE;
        aviso.textContent = `⚠️ Limite excedido por ${formatarReal(excesso)}!`;
        aviso.style.display = "block";
      } else {
        aviso.style.display = "none";
      }

      // Atualizar barra de progresso
      let porcentagem = Math.min((total / LIMITE) * 100, 100);
      progressBar.style.width = porcentagem + "%";
      progressBar.textContent = Math.floor(porcentagem) + "%";

      // Cor da barra
      if (porcentagem < 70) {
        progressBar.style.backgroundColor = "#4caf50"; // verde
      } else if (porcentagem < 100) {
        progressBar.style.backgroundColor = "#ff9800"; // laranja
      } else {
        progressBar.style.backgroundColor = "#f44336"; // vermelho
      }
    }

    function registrarTarefa() {
      const input = document.getElementById("valor");
      const valorTexto = input.value.replace(",", ".");
      const valor = parseFloat(valorTexto);

      if (isNaN(valor) || valor <= 0) {
        alert("Por favor, informe um valor válido maior que zero.");
        return;
      }

      const hoje = new Date().toLocaleDateString("pt-BR");
      const historico = carregarHistorico();

      historico.push({ data: hoje, valor });

      salvarHistorico(historico);
      input.value = "";
      atualizarTela();
    }

    function limparHistorico() {
      if (confirm("Tem certeza que deseja limpar todo o histórico?")) {
        localStorage.removeItem("tarefas");
        atualizarTela();
      }
    }

    atualizarTela();
  </script>
</body>
</html>
